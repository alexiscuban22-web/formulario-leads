<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de casas — Amabilly Beatriz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/catalogo.css">
<link rel="stylesheet" href="/assets/css/site-footer.css">
<script src="/assets/js/site.js"></script>
</head>
<body>

<div class="langbar">
  <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')"><span class="flag">🇺🇸</span><span>EN</span></button>
  <button type="button" class="lang-btn active" data-lang="es" onclick="setLanguage('es')"><span class="flag">🇪🇸</span><span>ES</span></button>
  <button type="button" class="lang-btn" data-lang="pt" onclick="setLanguage('pt')"><span class="flag">🇧🇷</span><span>PT</span></button>
</div>

<div class="page" id="page">

  <div class="hero reveal">
    <svg class="skyline" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="0" y1="70" x2="400" y2="70" stroke="#B79367" stroke-width="1" opacity="0.35"/>
      <g stroke="#B79367" stroke-width="1.2" opacity="0.55" fill="none">
        <rect x="40" y="34" width="14" height="36"/>
        <rect x="60" y="20" width="10" height="50"/>
        <rect x="76" y="42" width="16" height="28"/>
        <rect x="160" y="12" width="12" height="58"/>
        <rect x="176" y="30" width="18" height="40"/>
        <rect x="198" y="24" width="10" height="46"/>
        <rect x="260" y="38" width="14" height="32"/>
        <rect x="278" y="16" width="11" height="54"/>
        <rect x="294" y="46" width="16" height="24"/>
      </g>
      <circle cx="330" cy="30" r="9" stroke="#B79367" stroke-width="1" opacity="0.4" fill="none"/>
    </svg>

    <p class="eyebrow" data-i18n="eyebrow_catalogo">Miami-Dade · Catálogo</p>
    <h1 data-i18n="h1_catalogo">Casas disponibles</h1>
    <p class="sub" data-i18n="sub_catalogo">Selección personal de propiedades — toca una para ver todos los detalles.</p>
  </div>

  <a class="back-link" href="/"><span class="arrow">←</span><span data-i18n="back_link_home">Inicio</span></a>

  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none" data-i18n="empty_catalogo">Muy pronto más propiedades por aquí.</div>

  <footer class="site-footer" id="siteFooter"></footer>

</div>

<script src="/catalogo/data.js"></script>
<script>
  var currentLang = 'es';

  function fmtPrice(n){ return '$' + n.toLocaleString('en-US'); }

  function renderGrid(){
    var grid = document.getElementById('grid');
    var t = CATALOGO_UI[currentLang];
    if (!PROPERTIES.length){
      grid.innerHTML = '';
      document.getElementById('emptyState').style.display = 'block';
      return;
    }
    document.getElementById('emptyState').style.display = 'none';
    grid.innerHTML = PROPERTIES.map(function(p){
      return '' +
        '<a class="card reveal" href="/catalogo/' + p.slug + '/">' +
          '<div class="card-img-wrap">' +
            '<span class="badge">' + (p.operation === 'renta' ? t.badge_renta : t.badge_venta) + '</span>' +
            '<img src="' + p.images.cover + '" alt="' + p.title[currentLang] + '" loading="lazy">' +
          '</div>' +
          '<div class="card-body">' +
            '<p class="card-price">' + fmtPrice(p.price) + '</p>' +
            '<p class="card-address">' + p.address + '</p>' +
            '<div class="card-specs">' +
              '<span>' + p.beds + ' ' + t.spec_beds + '</span>' +
              '<span>' + p.baths + ' ' + t.spec_baths + '</span>' +
              '<span>' + p.sqft.toLocaleString('en-US') + ' ' + t.spec_sqft + '</span>' +
            '</div>' +
          '</div>' +
        '</a>';
    }).join('');
  }

  function applyStaticTranslations(){
    var t = CATALOGO_UI[currentLang];
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) el.textContent = t[key];
    });
  }

  var homeLabel = { es: 'Inicio', en: 'Home', pt: 'Início' };

  function setLanguage(lang){
    currentLang = lang;
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    document.querySelector('[data-i18n="back_link_home"]').textContent = homeLabel[lang];
    applyStaticTranslations();
    renderGrid();
    renderSiteFooter(lang);
    saveLang(lang);
  }

  setLanguage(getSavedLang('es'));
</script>

</body>
</html>
